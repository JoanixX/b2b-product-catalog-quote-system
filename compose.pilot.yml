name: trazo-pilot
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trazo
      POSTGRES_USER: trazo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate private local configuration first}
    volumes:
      - pilot-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U trazo -d trazo"]
      interval: 3s
      retries: 20
  api:
    image: rust:1.96-bookworm
    working_dir: /app
    command: [cargo, run, --locked]
    environment:
      DATABASE_URL: postgres://trazo:${POSTGRES_PASSWORD}@db:5432/trazo
      JWT_SECRET: ${JWT_SECRET:?Generate private local configuration first}
      PORT: 3000
      CORS_ORIGIN: http://localhost:3005
    ports: ["127.0.0.1:3005:3000"]
    volumes:
      - ./backend:/app
      - pilot-target:/app/target
      - pilot-cargo:/usr/local/cargo/registry
    depends_on:
      db:
        condition: service_healthy
volumes:
  pilot-data:
  pilot-target:
  pilot-cargo:
